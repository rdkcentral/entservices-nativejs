permissions:
  contents: read
name: nativejs-test-trigger

on:
  push:
    branches: [ main, develop, 'sprint/**', 'release/**' ]
  pull_request:
    branches: [ main, develop, 'sprint/**', 'release/**' ]

jobs:
  trigger-nativejs-l1:
    if: false
    runs-on: ubuntu-22.04
    steps:
      - name: Disabled NativeJS L1 trigger
        run: echo "NativeJS L1 tests are disabled until they exist."

  trigger-nativejs-l2:
    if: false
    runs-on: ubuntu-22.04
    steps:
      - name: Disabled NativeJS L2 trigger
        run: echo "NativeJS L2 tests are disabled until they exist."

  trigger-nativejs-l2-oop:
    if: false
    runs-on: ubuntu-22.04
    steps:
      - name: Disabled NativeJS L2 OOP trigger
        run: echo "NativeJS L2 OOP tests are disabled until they exist."
